name: AdminPanel
options:
  bundleIdPrefix: com.jewelindia
  minimumXcodeGenVersion: 2.0.0
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
targets:
  AdminPanel:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      - path: AdminPanel/Sources
      - path: AdminPanel/Resources
    dependencies:
      - package: Supabase
    # XcodeGen only writes an .xcscheme when a target declares one explicitly.
    scheme: {}
    settings:
      base:
        # Kept in sync with the generated project — an empty value here wipes
        # the team/signing style the next time anyone runs xcodegen, which
        # silently breaks device builds and Archive.
        DEVELOPMENT_TEAM: J3BH2RPA7Y
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        # Exporting with method `app-store-connect` sets the build number
        # itself: Xcode asks App Store Connect for the latest build of this
        # MARKETING_VERSION and stamps the next one, ignoring the value here.
        # So this is only the floor for local/device builds — keep it in sync
        # with the last upload rather than trusting it to drive one.
        # 1.0 (9) uploaded 2026-09-19; builds 1-8 are spent.
        CURRENT_PROJECT_VERSION: "9"
    info:
      path: AdminPanel/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
