name: AdminPanel
options:
  bundleIdPrefix: com.jewelindia
  minimumXcodeGenVersion: 2.0.0
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
targets:
  AdminPanel:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      - path: AdminPanel/Sources
      - path: AdminPanel/Resources
    dependencies:
      - package: Supabase
    # XcodeGen only writes an .xcscheme when a target declares one explicitly.
    scheme: {}
    settings:
      base:
        # Kept in sync with the generated project — an empty value here wipes
        # the team/signing style the next time anyone runs xcodegen, which
        # silently breaks device builds and Archive.
        DEVELOPMENT_TEAM: AAF6438546
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        # Bump this by 1 before every new Archive you intend to upload —
        # App Store Connect rejects a re-upload whose build number isn't
        # strictly higher than the last one it received (last upload was 2).
        CURRENT_PROJECT_VERSION: "3"
    info:
      path: AdminPanel/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
